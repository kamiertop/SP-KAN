[project]
name = "sp-kan"
version = "0.1.0"
description = "Sparse-sine Perception Kolmogorov-Arnold Networks for infrared small target detection"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "einops>=0.6",
    "numpy>=1.23",
    "pillow>=9.0",
    "scikit-image>=0.19",
    "tensorboard>=2.10",
    "thop>=0.1.1.post2209072238",
    "timm>=0.6",
    "torch>=2.0",
    "torchvision>=0.15",
    "tqdm>=4.64",
]

[tool.uv]
package = false

# The training and evaluation scripts require CUDA on Linux. Other platforms
# receive the CPU build so that dependency resolution remains portable.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true
